name: Build & Release APK

on:
  push:
    tags:
      - "v*"            # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:     # or run manually from the Actions tab

permissions:
  contents: write        # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # You only commit pubspec.yaml + lib/main.dart + this workflow.
      # The Android scaffold is generated here if it doesn't exist.
      - name: Generate Android scaffold
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp lib/main.dart /tmp/main.dart
            flutter create --platforms=android --org com.lensfinder --project-name lens_finder .
            cp /tmp/pubspec.yaml pubspec.yaml
            cp /tmp/main.dart lib/main.dart
            rm -rf test
          fi

      # Release builds don't get INTERNET by default, and url_launcher
      # needs an https <queries> entry on Android 11+; image_cropper needs UCropActivity.
      - name: Patch AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          fi
          if ! grep -q 'android:scheme="https"' "$M"; then
            sed -i 's|<queries>|<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>|' "$M"
          fi
          if ! grep -q "UCropActivity" "$M"; then
            sed -i 's|</application>|    <activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>\n    </application>|' "$M"
          fi
          sed -i 's|android:label="[^"]*"|android:label="Lens Finder"|' "$M"
          cat "$M"

      - run: flutter pub get

      # App icon + splash screen from assets/ (generated into the Android project).
      - name: Generate launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      # Same signing key on every build => new APKs install OVER the old one
      # (without this, each CI run signs with a fresh random key and Android
      # forces an uninstall first). Optional override: repo secret
      # DEBUG_KEYSTORE_BASE64 (base64 of your own keystore).
      - name: Use stable signing key
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          elif [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
          fi

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "ver=" >> "$GITHUB_OUTPUT"
          fi

      # Tag v2.1.0 => versionName 2.1.0, versionCode = run number.
      - name: Build release APK
        run: |
          if [ -n "${{ steps.tag.outputs.ver }}" ]; then
            flutter build apk --release --build-name="${{ steps.tag.outputs.ver }}" --build-number="${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "LensFinder-${{ steps.tag.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LensFinder-apk
          path: LensFinder-${{ steps.tag.outputs.name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Lens Finder ${{ steps.tag.outputs.name }}
          files: LensFinder-${{ steps.tag.outputs.name }}.apk
          generate_release_notes: true
