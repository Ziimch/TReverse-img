name: Build APK

# Runs on EVERY push to ANY branch, on version tags, and manually.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first run only)
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp lib/main.dart /tmp/main.dart
            flutter create --platforms=android --org com.lensfinder --project-name lens_finder .
            cp /tmp/pubspec.yaml pubspec.yaml
            cp /tmp/main.dart lib/main.dart
            rm -rf test
          fi

      - name: Patch AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          fi
          if ! grep -q 'android:scheme="https"' "$M"; then
            sed -i 's|<queries>|<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>|' "$M"
          fi
          if ! grep -q "UCropActivity" "$M"; then
            sed -i 's|</application>|    <activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>\n    </application>|' "$M"
          fi
          sed -i 's|android:label="[^"]*"|android:label="Lens Finder"|' "$M"

      - name: Get packages
        run: flutter pub get

      - name: Generate icons and splash (non-fatal)
        continue-on-error: true
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Use stable signing key
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          elif [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
          fi

      - name: Work out version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          if [ -n "${{ steps.v.outputs.name }}" ]; then
            flutter build apk --release --build-name="${{ steps.v.outputs.name }}" --build-number="${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "LensFinder-${{ steps.v.outputs.tag }}.apk"

      - name: Save APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: LensFinder-apk
          path: LensFinder-${{ steps.v.outputs.tag }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Lens Finder ${{ steps.v.outputs.tag }}
          files: LensFinder-${{ steps.v.outputs.tag }}.apk
          generate_release_notes: true
